name: Site check

on:
  push:
    paths:
      - .github/workflows/site-check.yml

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every registered video must be playable and on our channel
        shell: bash
        run: |
          set +e
          fail=0
          # oEmbed answers 200 only for a public, playable video, and names its owner.
          check() {
            code=$(curl -s -o /tmp/oe.json -w '%{http_code}' \
              "https://www.youtube.com/oembed?url=https://youtu.be/$1&format=json")
            if [ "$code" != "200" ]; then
              printf '  DEAD  %-12s %-32s oembed %s\n' "$1" "$2" "$code"
              fail=$((fail+1)); return
            fi
            python3 - "$1" "$2" <<'PY'
          import json, sys
          d = json.load(open('/tmp/oe.json'))
          print(f"  ok    {sys.argv[1]:<12} {sys.argv[2]:<32} {d['author_name']} | {d['title'][:52]}")
          PY
          }

          echo "== album 10 =="
          python3 -c "
          import json
          for e in json.load(open('src/content/music/releases.json')):
              if e.get('album') == 10:
                  print(e['youtubeId'], e['id'])
          " | while read y id; do check "$y" "$id"; done

          echo
          echo "== every other registered video =="
          python3 -c "
          import json
          for e in json.load(open('src/content/music/releases.json')):
              if e.get('youtubeId') and e.get('album') != 10:
                  print(e['youtubeId'], e['id'])
          " > /tmp/rest.txt
          dead=0
          while read y id; do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              "https://www.youtube.com/oembed?url=https://youtu.be/$y&format=json")
            [ "$code" = "200" ] || { printf '  DEAD  %-12s %s (%s)\n' "$y" "$id" "$code"; dead=$((dead+1)); }
          done < /tmp/rest.txt
          echo "  checked $(wc -l < /tmp/rest.txt), dead $dead"
