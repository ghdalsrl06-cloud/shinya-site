# Temporary: fetches the live site from a runner so a session behind an egress
# proxy can read it. Delete once the check has run.
name: Site check

on:
  push:
    branches: [claude/blog-check-159lvt]
    paths: ['.github/workflows/site-check.yml']

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the SPECIAL pages
        run: |
          set -u
          BASE=https://shinya-music.com
          say() { printf '\n===== %s =====\n' "$1"; }
          text() { sed 's/></>\n</g' | sed 's/<[^>]*>/ /g' | tr -s ' \n' '  '; }

          say 'status code + bytes'
          for p in \
            /music/tonight-the-curtain-rises/ \
            /ko/music/tonight-the-curtain-rises/ \
            /ja/music/tonight-the-curtain-rises/ \
            /music/ /ko/music/ /about/ /links/ \
            /blog/behind-tonight-the-curtain-rises/ \
            /ko/blog/behind-tonight-the-curtain-rises/ \
            /images/covers/album-12.jpg \
            /images/covers/tonight-the-curtain-rises.jpg \
            /images/opt/covers/album-12-w480.webp \
            /images/opt/covers/tonight-the-curtain-rises-w1280.webp ; do
            printf '%-58s %s' "$p" "$(curl -sS -o /dev/null -w '%{http_code}  %{size_download} bytes\n' -L "$BASE$p")"
          done

          say 'song page (ko)'
          curl -sS -L "$BASE/ko/music/tonight-the-curtain-rises/" > song.html
          grep -o '<title>[^<]*' song.html
          grep -o 'data-video-id="[^"]*"' song.html | head -1
          grep -o 'song-hero-art[^>]*' song.html | head -c 300; echo
          grep -o 'property="og:image" content="[^"]*"' song.html | head -1
          printf 'lyrics blocks: '; grep -c 'lyrics-block' song.html
          printf 'hook line count: '; grep -o '今夜も 開演' song.html | wc -l

          say 'music page (en) — tab order'
          curl -sS -L "$BASE/music/" > music.html
          grep -o 'data-album-tab="[0-9]*" data-album-line="[a-z]*"' music.html | tr '\n' ' '; echo
          printf '\nchips: '; grep -o 'data-album-filter="[a-z]*"' music.html | tr '\n' ' '; echo
          printf 'jacket-plate placeholders left: '; grep -c 'jacket-plate' music.html || true

          say 'music page — panel 12 text'
          sed 's/></>\n</g' music.html | sed -n '/data-album-panel="12"/,/album-tracks/p' | sed 's/<[^>]*>/ /g' | tr -s ' \n' '  '; echo
          printf '\npanel 12 jacket: '
          sed 's/></>\n</g' music.html | sed -n '/data-album-panel="12"/,/album-tracks/p' | grep -o 'src="[^"]*album-12[^"]*"' | head -1

          say 'about page — album links'
          curl -sS -L "$BASE/about/" | grep -o 'href="/music/#album-[0-9]*"' | sort -u | tr '\n' ' '; echo

          say 'links page rows'
          curl -sS -L "$BASE/links/" | grep -o '<strong>[^<]*</strong>' | sed 's/<[^>]*>//g'

          say 'blog index (ko)'
          curl -sS -L "$BASE/ko/blog/" > blog.html
          grep -o 'data-blog-filter="[a-z0-9]*"' blog.html | tr '\n' ' '; echo
          printf 'special post refs: '; grep -c 'tonight-the-curtain-rises' blog.html || true

          say 'sitemap'
          printf 'sitemap entries for the special: '
          curl -sS -L "$BASE/sitemap-0.xml" | grep -o 'tonight-the-curtain-rises' | wc -l
