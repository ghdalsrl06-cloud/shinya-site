name: Site check

on:
  push:
    paths:
      - .github/workflows/site-check.yml

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      UA: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36'
    steps:
      - uses: actions/checkout@v4
      - name: Exercise scripts/youtube_videos.py against the live channel
        run: |
          curl -fsSL --max-time 30 -A "$UA" -H 'Accept-Language: en' \
            "https://www.youtube.com/@shinyatokyo/videos" -o /tmp/videos.html
          echo "page bytes: $(wc -c < /tmp/videos.html)"

          python3 scripts/youtube_videos.py page /tmp/videos.html > /tmp/videos.json

          python3 - <<'PY'
          import json, re, sys

          videos = json.load(open('/tmp/videos.json'))
          html = open('/tmp/videos.html', encoding='utf-8', errors='replace').read()
          raw = len(set(re.findall(r'"videoId":"([0-9A-Za-z_-]{11})"', html)))

          print(f'parsed: {len(videos)}   raw ids in page: {raw}')
          for v, t in videos[:10]:
              print(f'  {v}  {t[:64]}')

          known = set(re.findall(r'"youtubeId":\s*"([^"]+)"',
                                 open('src/content/music/releases.json').read()))
          new = [(v, t) for v, t in videos if v not in known]
          print(f'registered: {len(known)}   unregistered: {len(new)}')
          for v, t in new:
              print(f'  NEW  {v}  {t[:64]}')

          assert videos, 'parser produced nothing'
          assert len(videos) == raw, f'parsed {len(videos)} but the page has {raw}'
          missing = [v for v, t in videos if not t or t == v]
          assert not missing, f'no title for: {missing}'
          print('PARSER OK')
          PY
