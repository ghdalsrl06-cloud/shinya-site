name: Site check

on:
  push:
    paths:
      - .github/workflows/site-check.yml

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify the album 5 release flip
        run: |
          S=https://shinya-music.com
          fail=0
          IDS="breathing-in-the-back-seat the-shift-change-never-comes i-must-not-fall-asleep \
               only-the-marks-on-the-wall how-to-sit-on-the-last-train finally-quiet \
               everyones-awake in-your-room"
          YT="rLbVpNJmbw4 Mq4YuMJ8MFE _skdvsHXWcM j8JlisYenXA ZYDwxUfqv34 CXfc2vpqFhQ pdGD5zgWOXs j0yaxZXscoE"

          echo "== each track page: player present, pre art gone =="
          set -- $YT
          for id in $IDS; do
            y=$1; shift
            P=$(curl -s "$S/ko/music/$id/")
            echo "$P" | grep -q "$y" || { echo "  no player: $id"; fail=$((fail+1)); }
            # match the actual pre-art filename, not any string containing "-pre"
            echo "$P" | grep -q "$id-pre-w" && { echo "  still pre art: $id"; fail=$((fail+1)); }
            echo "$P" | grep -q "covers/$id-w" || { echo "  no titled cover: $id"; fail=$((fail+1)); }
          done
          echo "  8 tracks checked"

          echo
          echo "== album 5 panel: no coming-soon badge left, three locales =="
          for pre in "" "ko/" "ja/"; do
            M=$(curl -s "$S/${pre}music/")
            n=$(echo "$M" | grep -o 'data-album-panel="5".*' | grep -oE '준비중|Coming soon|準備中' | wc -l)
            b=$(echo "$M" | grep -c 'aR959SVwtuE')
            printf '  /%smusic/  mix player: %s   stale badges: %s\n' "$pre" "$b" "$n"
            [ "$n" = "0" ] || fail=$((fail+1))
            [ "$b" != "0" ] || fail=$((fail+1))
          done

          echo
          if [ "$fail" -gt 0 ]; then echo "PROBLEMS: $fail"; exit 1; else echo "ALL CHECKS PASSED"; fi
