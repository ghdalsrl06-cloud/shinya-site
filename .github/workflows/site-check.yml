name: Site check

on:
  push:
    paths:
      - .github/workflows/site-check.yml

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Discover where the video ids actually live
        run: |
          curl -fsSL -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36' \
            -H 'Accept-Language: en' "https://www.youtube.com/@shinyatokyo/videos" -o /tmp/videos.html

          python3 - <<'PY'
          import json, re
          from collections import Counter

          html = open('/tmp/videos.html', encoding='utf-8', errors='replace').read()
          ids = set(re.findall(r'"videoId":"([0-9A-Za-z_-]{11})"', html))
          print('raw videoIds in html:', len(ids))

          def balanced(s, start):
              depth, i, instr, esc = 0, start, False, False
              while i < len(s):
                  c = s[i]
                  if instr:
                      if esc: esc = False
                      elif c == '\\': esc = True
                      elif c == '"': instr = False
                  elif c == '"': instr = True
                  elif c == '{': depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0: return s[start:i+1]
                  i += 1

          # There may be several ytInitialData-ish assignments; inspect them all.
          for m in re.finditer(r'(ytInitialData|ytInitialPlayerResponse)"?\]?\s*=\s*', html):
              name = m.group(1)
              blob = balanced(html, html.index('{', m.end()))
              inside = set(re.findall(r'"videoId":"([0-9A-Za-z_-]{11})"', blob))
              print(f'{name}: {len(blob)} bytes, videoIds inside: {len(inside)}')
              if not inside:
                  continue
              data = json.loads(blob)

              # Find every dict that carries a video id, and report the key it hangs off.
              hits = Counter()
              samples = {}
              def walk(n, parent_key=None):
                  if isinstance(n, dict):
                      vid = n.get('videoId') or n.get('contentId')
                      if isinstance(vid, str) and re.fullmatch(r'[0-9A-Za-z_-]{11}', vid):
                          hits[parent_key] += 1
                          samples.setdefault(parent_key, (vid, sorted(n.keys())[:14]))
                      for k, v in n.items():
                          walk(v, k)
                  elif isinstance(n, list):
                      for v in n:
                          walk(v, parent_key)
              walk(data)

              print('  containers holding a video id:')
              for k, c in hits.most_common(12):
                  vid, keys = samples[k]
                  print(f'    {k}  x{c}  e.g. {vid}  keys={keys}')

              # Where does a title live next to one of those?
              for key in ('lockupViewModel', 'videoRenderer', 'richItemRenderer'):
                  if key in hits:
                      def find(n):
                          if isinstance(n, dict):
                              if key in n and isinstance(n[key], dict):
                                  return n[key]
                              for v in n.values():
                                  r = find(v)
                                  if r: return r
                          elif isinstance(n, list):
                              for v in n:
                                  r = find(v)
                                  if r: return r
                      node = find(data)
                      print(f'  --- sample {key} (truncated) ---')
                      print('  ' + json.dumps(node, ensure_ascii=False)[:1500])
                      break
          PY
