name: Site check

on:
  push:
    paths:
      - .github/workflows/site-check.yml

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      UA: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36'
    steps:
      - name: Compare the registered 3집 mix id against the one on the channel
        run: |
          for v in SAwzpriQhqo M4s5tCBoHoY ; do
            echo "=== $v ==="
            # oEmbed answers 200 only for a video that is public and playable.
            printf '  oembed:   %s\n' \
              "$(curl -s -o /tmp/oe.json -w '%{http_code}' \
                 "https://www.youtube.com/oembed?url=https://youtu.be/$v&format=json")"
            head -c 300 /tmp/oe.json; echo
            printf '  watch page: %s\n' \
              "$(curl -s -o /tmp/w.html -w '%{http_code}' -A "$UA" "https://www.youtube.com/watch?v=$v")"
            grep -oP '<meta name="title" content="\K[^"]+' /tmp/w.html | head -1 | sed 's/^/  title: /'
            grep -oP '"ownerChannelName":"\K[^"]+' /tmp/w.html | head -1 | sed 's/^/  owner: /'
            grep -oP '"lengthSeconds":"\K[0-9]+' /tmp/w.html | head -1 | sed 's/^/  seconds: /'
            grep -oq 'isUnlisted' /tmp/w.html && echo '  (has isUnlisted flag)'
            grep -oP '"status":"\K[A-Z_]+' /tmp/w.html | head -2 | sed 's/^/  status: /'
            echo
          done
