name: Site check

on:
  push:
    paths:
      - .github/workflows/site-check.yml

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate a scraper that replaces the dead RSS feed
        run: |
          curl -fsSL -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36' \
            -H 'Accept-Language: en' "https://www.youtube.com/@shinyatokyo/videos" -o /tmp/videos.html
          echo "page bytes: $(wc -c < /tmp/videos.html)"

          python3 - <<'PY'
          import json, re

          html = open('/tmp/videos.html', encoding='utf-8', errors='replace').read()
          m = re.search(r'ytInitialData\s*=\s*(\{.*?\})\s*;\s*</script>', html, re.S)
          print('ytInitialData found:', bool(m))
          data = json.loads(m.group(1))

          found = []
          def walk(node):
              if isinstance(node, dict):
                  vr = node.get('videoRenderer') or node.get('gridVideoRenderer')
                  if isinstance(vr, dict) and vr.get('videoId'):
                      t = vr.get('title', {})
                      title = t.get('simpleText') or ''.join(r.get('text','') for r in t.get('runs', []))
                      found.append((vr['videoId'], title))
                  for v in node.values():
                      walk(v)
              elif isinstance(node, list):
                  for v in node:
                      walk(v)
          walk(data)

          seen, vids = set(), []
          for v, t in found:
              if v not in seen:
                  seen.add(v); vids.append((v, t))
          print(f'videos parsed: {len(vids)}')
          for v, t in vids[:8]:
              print(f'  {v}  {t[:60]}')

          known = set(re.findall(r'"youtubeId":\s*"([^"]+)"', open('src/content/music/releases.json').read()))
          print(f'registered in releases.json: {len(known)}')
          new = [(v, t) for v, t in vids if v not in known]
          print(f'unregistered: {len(new)}')
          for v, t in new:
              print(f'  NEW  {v}  {t[:60]}')
          PY
