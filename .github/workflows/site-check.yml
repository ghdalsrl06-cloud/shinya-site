name: Site check

on:
  push:
    paths:
      - .github/workflows/site-check.yml

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Is the feeds endpoint blocked, or is it this channel?
        run: |
          OURS=UCt3dNqlRzF_MeHKzNr7bywQ
          # Two long-lived, very large channels as controls.
          YT=UCBR8-60-B28hp2BmDPdntcQ   # YouTube's own channel
          GOOG=UCK8sQmJBp8GCxrOtXWBpyEA # Google

          echo "== plain curl, no headers =="
          for id in $OURS $YT $GOOG; do
            printf '  %-26s %s\n' "$id" "$(curl -s -o /dev/null -w '%{http_code}' "https://www.youtube.com/feeds/videos.xml?channel_id=$id")"
          done

          echo
          echo "== with a browser UA =="
          for id in $OURS $YT $GOOG; do
            printf '  %-26s %s\n' "$id" "$(curl -s -o /dev/null -w '%{http_code}' \
              -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36' \
              "https://www.youtube.com/feeds/videos.xml?channel_id=$id")"
          done

          echo
          echo "== our channel: response body and headers =="
          curl -s -D - -o /tmp/body.txt \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36' \
            "https://www.youtube.com/feeds/videos.xml?channel_id=$OURS" | head -20
          echo "  --- first 400 bytes of body ---"
          head -c 400 /tmp/body.txt; echo

          echo
          echo "== alternative feed spellings for our channel =="
          for u in "https://www.youtube.com/feeds/videos.xml?channel_id=$OURS" \
                   "https://youtube.com/feeds/videos.xml?channel_id=$OURS" \
                   "https://www.youtube.com/feeds/videos.xml?user=shinyatokyo" \
                   "https://www.youtube.com/@shinyatokyo/videos" \
                   "https://www.youtube.com/channel/$OURS" ; do
            printf '  %-70s %s\n' "$u" "$(curl -s -o /dev/null -w '%{http_code}' -A 'Mozilla/5.0' "$u")"
          done

          echo
          echo "== does the channel page still list videos? =="
          n=$(curl -fsSL -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)' -H 'Accept-Language: en' \
                "https://www.youtube.com/@shinyatokyo/videos" \
              | grep -oP '"videoId":"\K[0-9A-Za-z_-]{11}' | sort -u | wc -l)
          echo "  distinct videoIds on /videos: $n"
