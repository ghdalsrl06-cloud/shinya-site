name: Fetch generated scene assets

on:
  push:
    branches: [claude/blog-check-159lvt]
    paths: ['.github/workflows/fetch-assets.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/blog-check-159lvt
      - name: Download images
        run: |
          curl -fsSL -o public/images/music-banner-src.png "https://d8j0ntlcm91z4.cloudfront.net/user_3GlkPnXPJFo7VCrgoZkgPhAXpRM/hf_20260807_125908_fdf27346-4ec6-4a99-b163-f0149ca3c4dd.png"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/images
          git commit -m "Add generated music banner source image"
          git push
