name: Fetch assets

on:
  push:
    branches: [claude/blog-check-159lvt]
    paths: ['.github/workflows/fetch-assets.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download album-4 jacket
        run: |
          curl -fL -o album-4-raw.png 'https://d8j0ntlcm91z4.cloudfront.net/user_3GlkPnXPJFo7VCrgoZkgPhAXpRM/hf_20260810_153601_85f5d9a0-0410-4409-98a6-a6b52856d8c4.png'
      - name: Commit assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add album-4-raw.png
          git commit -m 'Fetch album-4 jacket'
          git push
