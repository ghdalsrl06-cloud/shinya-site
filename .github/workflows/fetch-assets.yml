name: Fetch generated scene assets

on:
  push:
    branches: [claude/blog-check-159lvt]
    paths: ['.github/workflows/fetch-assets.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/blog-check-159lvt
      - name: Download images
        run: |
          mkdir -p public/images/home
          curl -fsSL -o public/images/hero-src.png "https://d8j0ntlcm91z4.cloudfront.net/user_3GlkPnXPJFo7VCrgoZkgPhAXpRM/hf_20260807_121028_b3feb033-575f-4f25-9775-61813b9fcea2.png"
          curl -fsSL -o public/images/home/rooftop-src.png "https://d8j0ntlcm91z4.cloudfront.net/user_3GlkPnXPJFo7VCrgoZkgPhAXpRM/hf_20260807_121028_2b116c60-b88b-4a97-a219-c4c300ff2216.png"
          curl -fsSL -o public/images/home/studio-src.png "https://d8j0ntlcm91z4.cloudfront.net/user_3GlkPnXPJFo7VCrgoZkgPhAXpRM/hf_20260807_121028_366d9910-011d-48a8-aad4-cedfdd674585.png"
          curl -fsSL -o public/images/home/vending-src.png "https://d8j0ntlcm91z4.cloudfront.net/user_3GlkPnXPJFo7VCrgoZkgPhAXpRM/hf_20260807_121028_453d0c01-0f3b-4c11-820e-91ae4195f412.png"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/images
          git commit -m "Add generated home image sources"
          git push
