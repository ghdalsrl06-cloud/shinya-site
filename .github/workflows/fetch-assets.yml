name: Fetch generated scene assets

on:
  push:
    branches: [claude/blog-check-159lvt]
    paths: ['.github/workflows/fetch-assets.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/blog-check-159lvt
      - name: Download images
        run: |
          curl -fsSL -o public/images/links-banner-src.png "https://d8j0ntlcm91z4.cloudfront.net/user_3GlkPnXPJFo7VCrgoZkgPhAXpRM/hf_20260807_131231_e044455e-c339-46e3-b644-77df64dadb92.png"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/images
          git commit -m "Add generated links banner source image"
          git push
