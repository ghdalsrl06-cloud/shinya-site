# Temporary: fetches the generated album-5 jacket into the repo from a
# GitHub runner (the dev sandbox's egress proxy blocks the CDN host).
# Removed after use.
name: Upload stem
on:
  push:
    branches: [claude/blog-check-159lvt]
    paths: ['.github/workflows/upload-stem.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch album-5 jacket and commit
        run: |
          curl -sSf -o album5-jacket-4k.png \
            "https://d8j0ntlcm91z4.cloudfront.net/user_3GlkPnXPJFo7VCrgoZkgPhAXpRM/hf_20260813_130326_6f91a331-cc69-4bb1-869c-c3ac29aa8c1e.png"
          ls -la album5-jacket-4k.png
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add album5-jacket-4k.png
          git commit -m "Fetch album-5 jacket"
          git push
