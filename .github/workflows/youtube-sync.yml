name: YouTube sync

# Checks the channel daily and opens an issue for any video that is not yet
# registered in releases.json. No automatic commits — a human (or a Claude
# session) registers the video afterwards.

on:
  schedule:
    - cron: '20 0 * * *' # daily 09:20 KST, after the blog rebuild
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CHANNEL_HANDLE: shinyatokyo
      UA: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36'
    steps:
      - uses: actions/checkout@v4

      - name: Collect the channel's recent videos
        run: |
          # The Atom feed is tried first only because it is the cleaner source;
          # it has been answering 404 for every channel since early September,
          # so the channel page is what actually carries this job.
          cid=$(curl -fsSL --max-time 20 -A "$UA" -H 'Accept-Language: en' \
                  "https://www.youtube.com/@${CHANNEL_HANDLE}" \
                | grep -oP '"externalId":"\K(UC[0-9A-Za-z_-]{22})' | head -1 || true)

          src=
          if [ -n "$cid" ] && curl -fsSL --max-time 20 -A "$UA" \
               "https://www.youtube.com/feeds/videos.xml?channel_id=${cid}" -o /tmp/feed.xml \
               && grep -q '<entry>' /tmp/feed.xml; then
            src="feed /tmp/feed.xml"
            echo "source: Atom feed (channel ${cid})"
          else
            rm -f /tmp/feed.xml
            curl -fsSL --max-time 30 -A "$UA" -H 'Accept-Language: en' \
              "https://www.youtube.com/@${CHANNEL_HANDLE}/videos" -o /tmp/videos.html
            src="page /tmp/videos.html"
            echo "source: channel page (feed unavailable)"
          fi

          python3 scripts/youtube_videos.py $src > /tmp/videos.json
          python3 - <<'PY'
          import json, re, sys

          videos = json.load(open('/tmp/videos.json'))
          print(f'videos found: {len(videos)}')
          if not videos:
              # Reporting "nothing new" forever is worse than a failed run, so
              # an empty parse is treated as a broken parse.
              sys.exit('::error::No videos parsed — the source layout probably changed')

          known = set(re.findall(r'"youtubeId":\s*"([^"]+)"',
                                 open('src/content/music/releases.json').read()))
          new = [[v, t] for v, t in videos if v not in known]
          print(f'registered: {len(known)}, unregistered: {len(new)}')
          json.dump(new, open('/tmp/new.json', 'w'))
          PY

      - name: Ensure label exists
        run: gh label create youtube-sync --color FF2D6E --description "Auto-detected new YouTube video" || true

      - name: Open issues for unregistered videos
        run: |
          python3 - <<'PY'
          import json, subprocess

          for vid, title in json.load(open('/tmp/new.json')):
              # skip if an issue (open or closed) already mentions this video id
              r = subprocess.run(
                  ['gh', 'issue', 'list', '--state', 'all', '--search', f'"youtube-id: {vid}" in:body', '--json', 'number'],
                  capture_output=True, text=True,
              )
              if r.returncode == 0 and json.loads(r.stdout or '[]'):
                  print(f'skip (already reported): {vid}')
                  continue
              body = (
                  f'새 유튜브 영상이 감지되었습니다.\n\n'
                  f'- 제목: {title}\n'
                  f'- 링크: https://youtu.be/{vid}\n'
                  f'- youtube-id: {vid}\n\n'
                  f'사이트에 등록하려면 Claude 세션에서 이 링크를 공유하고 등록을 요청하세요.\n'
              )
              subprocess.run(
                  ['gh', 'issue', 'create', '--title', f'새 유튜브 영상: {title}', '--label', 'youtube-sync', '--body', body],
                  check=False,
              )
              print(f'issue created: {vid} {title}')
          PY
